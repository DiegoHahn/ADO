spring.application.name=ado

# In-memory database so the Spring context can start without PostgreSQL.
spring.datasource.url=jdbc:h2:mem:ado;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

ado.organization-url=https://dev.azure.com/test-organization/
ado.analytics-organization-url=https://analytics.dev.azure.com/test-organization/
