spring.application.name=ado

# Database. Every value can be overridden with an environment variable.
# The defaults only make sense for a local development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ado}
spring.datasource.username=${DB_USERNAME:ado}
spring.datasource.password=${DB_PASSWORD:ado}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Azure DevOps organization used for the REST and Analytics (OData) APIs.
ado.organization-url=${ADO_ORGANIZATION_URL:https://dev.azure.com/your-organization/}
ado.analytics-organization-url=${ADO_ANALYTICS_ORGANIZATION_URL:https://analytics.dev.azure.com/your-organization/}

# Base64-encoded 32-byte key used to encrypt the stored Azure DevOps tokens (AES-256-GCM).
# Required: the application refuses to start without it. Generate with: openssl rand -base64 32
ado.security.pat-encryption-key=${PAT_ENCRYPTION_KEY:}
